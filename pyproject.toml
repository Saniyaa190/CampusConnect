[project]
name = "campusconnect"
version = "1.0.0"
description = "CampusConnect - College Event Management System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0,<3.2.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.5",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.1",
    "WTForms>=3.1.0",
    "click>=8.1.7,<9",
    "python-dotenv>=1.0.1",
    "PyMySQL>=1.1.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "pytest>=8.0.0",
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"




