
[project]
name = "campusconnect"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.2.1",
    "email-validator>=2.1.0",
    "python-dotenv>=1.0.1",
    "Pillow>=10.2.0",
    "click>=8.1.7"
]

[tool.vercel]
entrypoint = "api.index:app"
