{% extends "base.html" %}
{% block title %}Page Not Found (404) - CampusConnect{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-modern p-5 max-w-lg mx-auto shadow-sm my-5" style="max-width: 550px;">
    <div class="rounded-circle bg-warning-subtle text-warning-emphasis d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
      <i class="bi bi-compass fs-1"></i>
    </div>
    <h2 class="fw-bold mb-2">404 - Page Not Found</h2>
    <p class="text-secondary mb-4">
      The event or page you are looking for doesn't exist or may have been moved or cancelled.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('events.discover') }}" class="btn btn-primary-indigo">Explore Events</a>
      <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Go to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
