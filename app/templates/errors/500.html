{% extends "base.html" %}
{% block title %}Server Error (500) - CampusConnect{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card-modern p-5 max-w-lg mx-auto shadow-sm my-5" style="max-width: 550px;">
    <div class="rounded-circle bg-danger-subtle text-danger d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
      <i class="bi bi-exclamation-octagon fs-1"></i>
    </div>
    <h2 class="fw-bold mb-2">500 - Internal Server Error</h2>
    <p class="text-secondary mb-4">
      An unexpected error occurred while processing your request. Please try again or return to the main dashboard.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-indigo">Return Home</a>
  </div>
</div>
{% endblock %}
