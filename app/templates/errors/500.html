{% extends "base.html" %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center; max-width: 640px;">
  <div style="font-size: 4.5rem; line-height: 1; margin-bottom: 1rem;">⚙️</div>
  <span class="badge-cat Sports" style="margin-bottom: 0.75rem; display: inline-block;">Error 500</span>
  <h1 style="font-size: 2.5rem; color: var(--primary-purple); margin-bottom: 1rem;">Internal Server Error</h1>
  <p style="font-size: 1.1rem; color: var(--color-slate); line-height: 1.6; margin-bottom: 2rem;">
    Our server encountered an unexpected situation while processing your request. Any active database changes were safely rolled back.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('main.home') }}" class="btn btn-primary">Return Home</a>
    <a href="{{ url_for('events.index') }}" class="btn btn-outline">Browse Events</a>
  </div>
</div>
{% endblock %}
